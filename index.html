<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>计时器 · 待办 · 日记</title>
<style>
  :root { --bg:#f7f7f8; --card:#fff; --text:#222; --muted:#888; --accent:#4f46e5; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background:var(--bg); color:var(--text); }
  header { padding:20px; text-align:center; }
  .tabs { display:flex; justify-content:center; gap:8px; margin-bottom:16px; }
  .tabs button { padding:8px 16px; border:1px solid #ddd; background:#fff; border-radius:999px; cursor:pointer; }
  .tabs button.active { background:var(--accent); color:#fff; border-color:var(--accent); }
  main { max-width:640px; margin:0 auto; padding:0 16px 40px; }
  section { display:none; background:var(--card); border-radius:16px; padding:20px; box-shadow:0 2px 8px rgba(0,0,0,.06); }
  section.active { display:block; }
  #timer { font-size:64px; font-weight:700; text-align:center; margin:20px 0; font-variant-numeric: tabular-nums; }
  .row { display:flex; gap:8px; }
  input[type="text"], textarea, input[type="date"] { width:100%; padding:10px; border:1px solid #ddd; border-radius:8px; font:inherit; }
  button { padding:10px 14px; border:0; border-radius:8px; background:var(--accent); color:#fff; cursor:pointer; }
  button.secondary { background:#e5e7eb; color:#333; }
  ul { list-style:none; padding:0; margin:16px 0 0; }
  li { display:flex; align-items:center; gap:8px; padding:10px 0; border-bottom:1px solid #eee; }
  li.done span { text-decoration: line-through; color:var(--muted); }
  li span { flex:1; }
  .diary-date { margin-bottom:8px; }
  textarea { min-height:160px; resize:vertical; }
  .hint { color:var(--muted); font-size:13px; margin-top:8px; }
</style>
</head>
<body>
<header><h1>我的小站</h1></header>
<div class="tabs">
  <button data-tab="timer" class="active">计时器</button>
  <button data-tab="todo">待办</button>
  <button data-tab="diary">日记</button>
</div>
<main>
  <section id="timer" class="active">
    <div id="timer">25:00</div>
    <div class="row">
      <button id="startPause">开始</button>
      <button id="reset" class="secondary">重置</button>
    </div>
    <p class="hint">默认 25 分钟番茄钟。可先从这里练手。</p>
  </section>

  <section id="todo">
    <div class="row">
      <input id="todoInput" type="text" placeholder="添加待办，回车确认">
      <button id="addTodo">添加</button>
    </div>
    <ul id="todoList"></ul>
  </section>

  <section id="diary">
    <input id="diaryDate" type="date" class="diary-date">
    <textarea id="diaryText" placeholder="写点什么..."></textarea>
    <div class="row" style="margin-top:8px">
      <button id="saveDiary">保存日记</button>
      <span id="diaryStatus" class="hint"></span>
    </div>
  </section>
</main>
<script>
  // 标签切换
  document.querySelectorAll('.tabs button').forEach(btn => {
    btn.onclick = () => {
      document.querySelectorAll('.tabs button').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('section').forEach(s => s.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById(btn.dataset.tab).classList.add('active');
    };
  });

  // 计时器
  let timeLeft = 25 * 60;
  let timerId = null;
  let running = false;
  const timerEl = document.getElementById('timer');
  const startPauseBtn = document.getElementById('startPause');

  function renderTimer() {
    const m = String(Math.floor(timeLeft / 60)).padStart(2, '0');
    const s = String(timeLeft % 60).padStart(2, '0');
    timerEl.textContent = `${m}:${s}`;
  }
  startPauseBtn.onclick = () => {
    if (running) {
      clearInterval(timerId);
      running = false;
      startPauseBtn.textContent = '继续';
    } else {
      if (timeLeft <= 0) timeLeft = 25 * 60;
      running = true;
      startPauseBtn.textContent = '暂停';
      timerId = setInterval(() => {
        timeLeft--;
        renderTimer();
        if (timeLeft <= 0) {
          clearInterval(timerId);
          running = false;
          startPauseBtn.textContent = '开始';
          alert('时间到！');
        }
      }, 1000);
    }
  };
  document.getElementById('reset').onclick = () => {
    clearInterval(timerId);
    running = false;
    timeLeft = 25 * 60;
    startPauseBtn.textContent = '开始';
    renderTimer();
  };
  renderTimer();

  // 待办
  const todoInput = document.getElementById('todoInput');
  const todoList = document.getElementById('todoList');
  let todos = JSON.parse(localStorage.getItem('todos') || '[]');

  function saveTodos() { localStorage.setItem('todos', JSON.stringify(todos)); }
  function renderTodos() {
    todoList.innerHTML = '';
    todos.forEach((todo, index) => {
      const li = document.createElement('li');
      if (todo.done) li.classList.add('done');
      const checkbox = document.createElement('input');
      checkbox.type = 'checkbox';
      checkbox.checked = todo.done;
      checkbox.onchange = () => { todos[index].done = checkbox.checked; saveTodos(); renderTodos(); };
      const span = document.createElement('span');
      span.textContent = todo.text;
      const del = document.createElement('button');
      del.textContent = '删除';
      del.className = 'secondary';
      del.onclick = () => { todos.splice(index, 1); saveTodos(); renderTodos(); };
      li.append(checkbox, span, del);
      todoList.appendChild(li);
    });
  }
  function addTodo() {
    const text = todoInput.value.trim();
    if (!text) return;
    todos.push({ text, done: false });
    todoInput.value = '';
    saveTodos();
    renderTodos();
  }
  document.getElementById('addTodo').onclick = addTodo;
  todoInput.addEventListener('keydown', e => { if (e.key === 'Enter') addTodo(); });
  renderTodos();

  // 日记
  const diaryDate = document.getElementById('diaryDate');
  const diaryText = document.getElementById('diaryText');
  const diaryStatus = document.getElementById('diaryStatus');
  let diaries = JSON.parse(localStorage.getItem('diaries') || '{}');

  function todayStr() {
    const d = new Date();
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    return `${y}-${m}-${day}`;
  }
  diaryDate.value = todayStr();

  function loadDiary() {
    diaryText.value = diaries[diaryDate.value] || '';
    diaryStatus.textContent = '';
  }
  diaryDate.onchange = loadDiary;
  document.getElementById('saveDiary').onclick = () => {
    diaries[diaryDate.value] = diaryText.value;
    localStorage.setItem('diaries', JSON.stringify(diaries));
    diaryStatus.textContent = '已保存';
    setTimeout(() => diaryStatus.textContent = '', 1500);
  };
  loadDiary();
</script>
</body>
</html>
