<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>计时器 · 待办 · 日记</title>
<style>
  /* 1. 树木河流天空背景图（用高清免费图源） */
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    color: #333;
    background: url('https://images.unsplash.com/photo-1501785888041-af3ef285b470?q=80&w=1920&auto=format&fit=crop') no-repeat center center fixed;
    background-size: cover;
    min-height: 100vh;
  }

  header { padding: 20px; text-align: center; }
  
  /* 2. 毛玻璃卡片效果 */
  .card-container {
    background: rgba(255, 255, 255, 0.75);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-radius: 24px;
    padding: 20px;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15);
    border: 1px solid rgba(255, 255, 255, 0.5);
    max-width: 640px;
    margin: 0 auto;
    position: relative;
  }

  .tabs { display: flex; justify-content: center; gap: 8px; margin-bottom: 16px; }
  .tabs button { padding: 8px 16px; border: 1px solid #ddd; background: #fff; border-radius: 999px; cursor: pointer; }
  .tabs button.active { background: #4f46e5; color: #fff; border-color: #4f46e5; }
  main { padding: 0 16px 40px; }
  section { display: none; }
  section.active { display: block; }

  /* 3. 多彩数字计时器 */
  #timer {
    font-size: 72px;
    font-weight: 900;
    text-align: center;
    margin: 20px 0;
    font-variant-numeric: tabular-nums;
    background: linear-gradient(90deg, #ff6b6b, #feca57, #48dbfb, #ff9ff3);
    background-size: 300% 300%;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: gradientMove 5s ease infinite;
  }

  @keyframes gradientMove {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  .row { display: flex; gap: 8px; }
  input[type="text"], textarea, input[type="date"] { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px; font: inherit; background: rgba(255,255,255,0.8); }
  button { padding: 10px 14px; border: 0; border-radius: 8px; background: #4f46e5; color: #fff; cursor: pointer; transition: 0.2s; }
  button:hover { background: #4338ca; transform: translateY(-2px); }
  button.secondary { background: #e5e7eb; color: #333; }
  ul { list-style: none; padding: 0; margin: 16px 0 0; }
  li { display: flex; align-items: center; gap: 8px; padding: 10px 0; border-bottom: 1px solid rgba(0,0,0,0.05); }
  li.done span { text-decoration: line-through; color: #888; }
  li span { flex: 1; }
  .diary-date { margin-bottom: 8px; }
  textarea { min-height: 160px; resize: vertical; }
  .hint { color: #666; font-size: 13px; margin-top: 8px; }

  /* 4. 萌萌的小猫小狗（边框上会动） */
  .pet {
    position: absolute;
    font-size: 40px;
    animation: bounce 2s infinite ease-in-out;
    z-index: 10;
    cursor: pointer;
    user-select: none;
  }
  .pet-cat { top: -20px; left: -20px; animation-delay: 0s; }
  .pet-dog { bottom: -20px; right: -20px; animation-delay: 0.5s; }
  
  @keyframes bounce {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    50% { transform: translateY(-15px) rotate(10deg); }
  }
</style>
</head>
<body>
<header><h1>我的小站</h1></header>
<main>
  <div class="card-container">
    <!-- 会动的小猫小狗 -->
    <div class="pet pet-cat" title="小猫">🐱</div>
    <div class="pet pet-dog" title="小狗">🐶</div>

    <div class="tabs">
      <button data-tab="timer" class="active">计时器</button>
      <button data-tab="todo">待办</button>
      <button data-tab="diary">日记</button>
    </div>

    <section id="timer" class="active">
      <div id="timer">25:00</div>
      <div class="row">
        <button id="startPause">开始</button>
        <button id="reset" class="secondary">重置</button>
      </div>
      <p class="hint">默认 25 分钟番茄钟。</p>
    </section>

    <section id="todo">
      <div class="row">
        <input id="todoInput" type="text" placeholder="添加待办，回车确认">
        <button id="addTodo">添加</button>
      </div>
      <ul id="todoList"></ul>
    </section>

    <section id="diary">
      <input id="diaryDate" type="date" class="diary-date">
      <textarea id="diaryText" placeholder="写点什么..."></textarea>
      <div class="row" style="margin-top:8px">
        <button id="saveDiary">保存日记</button>
        <span id="diaryStatus" class="hint"></span>
      </div>
    </section>
  </div>
</main>

<script>
  // 标签切换
  document.querySelectorAll('.tabs button').forEach(btn => {
    btn.onclick = () => {
      document.querySelectorAll('.tabs button').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('section').forEach(s => s.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById(btn.dataset.tab).classList.add('active');
    };
  });

  // 计时器
  let timeLeft = 25 * 60;
  let timerId = null;
  let running = false;
  const timerEl = document.getElementById('timer');
  const startPauseBtn = document.getElementById('startPause');

  function renderTimer() {
    const m = String(Math.floor(timeLeft / 60)).padStart(2, '0');
    const s = String(timeLeft % 60).padStart(2, '0');
    timerEl.textContent = `${m}:${s}`;
  }
  startPauseBtn.onclick = () => {
    if (running) {
      clearInterval(timerId);
      running = false;
      startPauseBtn.textContent = '继续';
    } else {
      if (timeLeft <= 0) timeLeft = 25 * 60;
      running = true;
      startPauseBtn.textContent = '暂停';
      timerId = setInterval(() => {
        timeLeft--;
        renderTimer();
        if (timeLeft <= 0) {
          clearInterval(timerId);
          running = false;
          startPauseBtn.textContent = '开始';
          alert('时间到！');
        }
      }, 1000);
    }
  };
  document.getElementById('reset').onclick = () => {
    clearInterval(timerId);
    running = false;
    timeLeft = 25 * 60;
    startPauseBtn.textContent = '开始';
    renderTimer();
  };
  renderTimer();

  // 待办
  const todoInput = document.getElementById('todoInput');
  const todoList = document.getElementById('todoList');
  let todos = JSON.parse(localStorage.getItem('todos') || '[]');
  function saveTodos() { localStorage.setItem('todos', JSON.stringify(todos)); }
  function renderTodos() {
    todoList.innerHTML = '';
    todos.forEach((todo, index) => {
      const li = document.createElement('li');
      if (todo.done) li.classList.add('done');
      const checkbox = document.createElement('input');
      checkbox.type = 'checkbox';
      checkbox.checked = todo.done;
      checkbox.onchange = () => { todos[index].done = checkbox.checked; saveTodos(); renderTodos(); };
      const span = document.createElement('span');
      span.textContent = todo.text;
      const del = document.createElement('button');
      del.textContent = '删除';
      del.className = 'secondary';
      del.onclick = () => { todos.splice(index, 1); saveTodos(); renderTodos(); };
      li.append(checkbox, span, del);
      todoList.appendChild(li);
    });
  }
  function addTodo() {
    const text = todoInput.value.trim();
    if (!text) return;
    todos.push({ text, done: false });
    todoInput.value = '';
    saveTodos(); renderTodos();
  }
  document.getElementById('addTodo').onclick = addTodo;
  todoInput.addEventListener('keydown', e => { if (e.key === 'Enter') addTodo(); });
  renderTodos();

  // 日记
  const diaryDate = document.getElementById('diaryDate');
  const diaryText = document.getElementById('diaryText');
  const diaryStatus = document.getElementById('diaryStatus');
  let diaries = JSON.parse(localStorage.getItem('diaries') || '{}');
  function todayStr() {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  }
  diaryDate.value = todayStr();
  function loadDiary() {
    diaryText.value = diaries[diaryDate.value] || '';
    diaryStatus.textContent = '';
  }
  diaryDate.onchange = loadDiary;
  document.getElementById('saveDiary').onclick = () => {
    diaries[diaryDate.value] = diaryText.value;
    localStorage.setItem('diaries', JSON.stringify(diaries));
    diaryStatus.textContent = '已保存';
    setTimeout(() => diaryStatus.textContent = '', 1500);
  };
  loadDiary();
</script>
</body>
</html>
